[workspace]
members = [
    "crates/fx-core",
    "crates/fx-oms",
    "crates/fx-ems",
    "crates/fx-md",
    "crates/fx-exchange",
    "crates/fx-lp",
    "crates/fx-pricing",
    "crates/fx-risk",
    "crates/fx-router",
    "crates/fx-gateway",
    "crates/fx-proto",
    "crates/fx-utils",
    "crates/fx-liquidity-graph",
    "crates/fx-ai-execution",
    "crates/fx-deterministic-core",
    "services/market-data-service",
    "services/pricing-service",
    "services/matching-engine-service",
    "services/risk-service",
    "services/router-service",
    "services/gateway-service",
    "services/liquidity-graph-service",
    "services/execution-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Roberto de Souza <rabbittrix@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/rabbittrix/Ultra-Low-Latency-FX-eTrading-Platform"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
] }

# gRPC
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# OpenAPI/Swagger
utoipa = { version = "5.4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "chrono",
] }
opentelemetry = { version = "0.25", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.18", features = ["tonic", "tonic-build"] }
opentelemetry_sdk = { version = "0.25", features = ["rt-tokio"] }
prometheus = "0.14.0"
prometheus_exporter = "0.8.5"

# Lock-free data structures
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.1"
parking_lot = "0.12"

# Network optimizations
socket2 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
