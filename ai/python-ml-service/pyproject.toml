[project]
name = "python-ml-service"
version = "0.1.0"
description = "Machine Learning service for volatility prediction in FX eTrading Platform"
authors = [{ name = "Roberto de Souza", email = "rabbittrix@hotmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "numpy==2.3.5",
    "scikit-learn==1.7.2",
    "onnxruntime==1.23.2",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["flake8", "black", "mypy", "pytest"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
