name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust - Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build all crates
        run: cargo build --all --all-features

      - name: Run tests
        run: cargo test --all --all-features

      - name: Build documentation
        run: cargo doc --all --no-deps

  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get npm cache directory
        id: npm-cache-dir-path
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/nextjs-trading-ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend/nextjs-trading-ui
        run: npm install

      - name: Run linter
        working-directory: frontend/nextjs-trading-ui
        run: npm run lint

      - name: Check formatting
        working-directory: frontend/nextjs-trading-ui
        run: npm run format -- --check

      - name: Build
        working-directory: frontend/nextjs-trading-ui
        run: npm run build

  python:
    name: Python - Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai/python-ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ai/python-ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black mypy pytest

      - name: Run flake8
        working-directory: ai/python-ml-service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting with black
        working-directory: ai/python-ml-service
        run: black --check .

      - name: Type check with mypy
        working-directory: ai/python-ml-service
        run: mypy . --ignore-missing-imports || true

  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [rust, frontend, python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust services
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.market-data
          push: false
          tags: fx-etrading:market-data-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/nextjs-trading-ui
          file: ./frontend/nextjs-trading-ui/Dockerfile
          push: false
          tags: fx-etrading:frontend-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai/python-ml-service
          file: ./ai/python-ml-service/Dockerfile
          push: false
          tags: fx-etrading:ml-service-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

