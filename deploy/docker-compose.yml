services:
  # Rust Services
  market-data-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.market-data
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      - RUST_LOG=info
    networks:
      - fx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  pricing-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pricing
    ports:
      - "8082:8082"
      - "9092:9092"
    environment:
      - RUST_LOG=info
      - AI_SERVICE_URL=http://python-ml-service:8086
    networks:
      - fx-network
    depends_on:
      market-data-service:
        condition: service_healthy
      # python-ml-service:  # Temporarily disabled due to SSL build issues
      #   condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  matching-engine-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.matching-engine
    ports:
      - "8083:8083"
      - "9093:9093"
      - "50051:50051" # gRPC port
    environment:
      - RUST_LOG=info
    networks:
      - fx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  risk-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.risk
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      - RUST_LOG=info
    networks:
      - fx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  router-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.router
    ports:
      - "8085:8085"
      - "9095:9095"
    environment:
      - RUST_LOG=info
    networks:
      - fx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  gateway-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - RUST_LOG=info
      - MARKET_DATA_URL=http://market-data-service:8081
      - PRICING_URL=http://pricing-service:8082
      - MATCHING_ENGINE_URL=http://matching-engine-service:8083
      - RISK_URL=http://risk-service:8084
    networks:
      - fx-network
    depends_on:
      market-data-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      matching-engine-service:
        condition: service_healthy
      risk-service:
        condition: service_healthy
      router-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../frontend/nextjs-trading-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway-service:8080
      - NODE_ENV=production
    networks:
      - fx-network
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # AI Service
  # Note: May experience SSL network issues during Docker build in some environments
  # This is a known issue with PyPI SSL connections in some Docker/network configurations
  # Workarounds: See ai/python-ml-service/BUILD_TROUBLESHOOTING.md
  # The platform is fully functional without the AI service
  python-ml-service:
    build:
      context: ../ai/python-ml-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - fx-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - fx-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fx-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:16686",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - fx-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - fx-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - fluentd-logs:/var/log/fluentd
    networks:
      - fx-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

networks:
  fx-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  fluentd-logs:
