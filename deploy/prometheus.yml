global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'market-data-service'
    static_configs:
      - targets: ['market-data-service:9091']

  - job_name: 'pricing-service'
    static_configs:
      - targets: ['pricing-service:9092']

  - job_name: 'matching-engine-service'
    static_configs:
      - targets: ['matching-engine-service:9093']

  - job_name: 'risk-service'
    static_configs:
      - targets: ['risk-service:9094']

  - job_name: 'router-service'
    static_configs:
      - targets: ['router-service:9095']

  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:9090']

