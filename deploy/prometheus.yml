global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fx-etrading'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'market-data-service'
    static_configs:
      - targets: ['market-data-service:9091']
        labels:
          service: 'market-data'

  - job_name: 'pricing-service'
    static_configs:
      - targets: ['pricing-service:9092']
        labels:
          service: 'pricing'

  - job_name: 'matching-engine-service'
    static_configs:
      - targets: ['matching-engine-service:9093']
        labels:
          service: 'matching-engine'

  - job_name: 'risk-service'
    static_configs:
      - targets: ['risk-service:9094']
        labels:
          service: 'risk'

  - job_name: 'router-service'
    static_configs:
      - targets: ['router-service:9095']
        labels:
          service: 'router'

  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:9090']
        labels:
          service: 'gateway'
