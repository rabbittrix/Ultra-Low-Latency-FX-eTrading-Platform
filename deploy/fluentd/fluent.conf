# Fluentd configuration for log aggregation
# 
# @author Roberto de Souza <rabbittrix@hotmail.com>
# @license Apache-2.0

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# Parse JSON logs
<filter **>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</filter>

# Add service metadata
<filter **>
  @type record_transformer
  <record>
    cluster fx-etrading
    environment development
  </record>
</filter>

# Route to Elasticsearch
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name fx-trading-logs
  type_name _doc
  logstash_format true
  logstash_prefix fx-trading
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  flush_interval 10s
  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_mode interval
    flush_interval 10s
    chunk_limit_size 2M
    queue_limit_length 8
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

