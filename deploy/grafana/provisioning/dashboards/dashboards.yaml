# Dashboard file provider: JSON lives in a dedicated path (not mixed with *.yaml).
#
# @author Roberto de Souza <rabbittrix@hotmail.com>
# @license Apache-2.0

apiVersion: 1

providers:
  - name: FX Trading Platform
    orgId: 1
    folder: FX Trading
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboard-definitions
