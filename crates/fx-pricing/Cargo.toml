[package]
name = "fx-pricing"
version = "0.1.3"
edition = "2021"
authors = ["Roberto de Souza <rabbittrix@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/rabbittrix/Ultra-Low-Latency-FX-eTrading-Platform.git"
description = "Pricing engine with risk-based adjustments for FX trading. Calculates bid/ask spreads, applies risk adjustments based on position exposure, and integrates with AI/ML services for volatility prediction to optimize pricing."
keywords = ["trading", "fx", "forex", "pricing", "spread"]
categories = ["algorithms"]

[dependencies]
fx-utils = { path = "../fx-utils" }
fx-md = { path = "../fx-md" }
fx-risk = { path = "../fx-risk" }
serde = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
